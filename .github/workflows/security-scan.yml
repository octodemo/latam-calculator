name: AppSec Vulnerability Scan (SAST & DAST)

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
        core_language:
          description: Dominant programming language application is written in
          required: true
          type: string
        
        # deploy_url:
        #   description: The acessible URL where the application is deployed.
        #   required: false
        #   type: string
  
jobs:
  SAST:
    name: SAST 🔍
    
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'javascript'
        # queries: security-and-quality
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  DAST:
    name: DAST 🔍

    # if: ${{ inputs.deploy_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build app Docker image
        run: docker build -t latam-calculator:scan .

      - name: Run app container
        run: docker run -d --name latam-calculator -p 3000:3000 latam-calculator:scan

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done
          echo "App failed to start in time"
          docker logs latam-calculator
          exit 1

      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
            token: ${{ secrets.GITHUB_TOKEN }}
            docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
            target: 'http://localhost:3000'
            # rules_file_name: '.zap/rules.tsv'
            # cmd_options: '-a'

      - name: Stop app container
        if: always()
        run: docker rm -f latam-calculator
      - name: Create sarif file from zaproxy results
        uses: SvanBoxel/zaproxy-to-ghas@main
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          
      - name: Upload CodeQL Analysis
        uses: actions/upload-artifact@v3
        with:
          path: results.sarif
